name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - thermal-tunes
    paths:
      - '.github/workflows/build.yml'
      - 'InsulationPrefs/**'
      - 'InsulationCC/**'
      - 'Sources/**'
      - 'layout/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - 'Package.swift'
      - 'control'
      - '*.plist'

jobs:
  package:
    name: Package (${{ matrix.scheme }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme:
          - rootless
          - roothide

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
      FINALPACKAGE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Install Theos SDK with private frameworks
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build package
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          bash -n layout/DEBIAN/postinst layout/DEBIAN/prerm scripts/check-objc-port.sh scripts/test-insulationctl-args.sh scripts/test-insulation-cpu-state.sh scripts/test-clean3-native-state-contract.sh scripts/test-clean3-mode-notification-contract.sh scripts/verify-insulationctl-package.sh
          scripts/check-objc-port.sh
          scripts/test-insulationctl-args.sh
          make clean SDKVERSION=16.5
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="${THEOS_PACKAGE_SCHEME}" SDKVERSION=16.5
          deb="$(ls packages/*.deb | head -n 1)"
          scripts/verify-insulationctl-package.sh "$deb"

      - name: Upload deb packages
        uses: actions/upload-artifact@v4
        with:
          name: insulation-${{ matrix.scheme }}-packages
          path: packages/*
          if-no-files-found: error
