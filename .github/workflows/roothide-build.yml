name: Build roothide

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - 'cloud/**'
      - 'release/**'
    paths:
      - '.github/workflows/roothide-build.yml'
      - '**/*.h'
      - '**/*.m'
      - '**/*.xm'
      - '**/*.xmi'
      - '**/*.plist'
      - '**/*.inc'
      - 'Makefile'
      - 'control'
      - 'layout/**'

jobs:
  package:
    name: Package (roothide)
    runs-on: macos-14

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      FINALPACKAGE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Install Theos SDK with private frameworks
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build package
        run: |
          set -o pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          rm -rf packages artifacts
          make clean SDKVERSION=16.5
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide SDKVERSION=16.5 2>&1 | tee /tmp/pm120-build.log
          if grep -q 'incompatible arm64e ABI compiler' /tmp/pm120-build.log; then echo 'FATAL: incompatible arm64e ABI compiler'; exit 1; fi
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          xcrun otool -hv .theos/obj/arm64e/ProMotion120.dylib
          mkdir -p artifacts
          cp "$deb" artifacts/

      - name: Upload deb package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion120-roothide-1.0.10-keepalive1
          path: artifacts/*.deb
          if-no-files-found: error