name: Build roothide

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/roothide-build.yml'
      - '**/*.h'
      - '**/*.m'
      - '**/*.xm'
      - '**/*.xmi'
      - '**/*.plist'
      - '**/*.inc'
      - 'Makefile'
      - 'control'
      - 'layout/**'
      - 'scripts/**'

jobs:
  package:
    name: Package (roothide)
    runs-on: macos-14

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      PM_FOREGROUND_PROBE_ENABLED: 1
      FINALPACKAGE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Install Theos SDK with private frameworks
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: List available schemes
        run: ls "$THEOS/makefiles/package/" 2>/dev/null || echo "No package dir"

      - name: Build package
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          bash -n scripts/check-foreground-probe.sh scripts/verify-foreground-probe-package.sh
          scripts/check-foreground-probe.sh
          # Probe-on build
          make clean SDKVERSION=16.5
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide PM_FOREGROUND_PROBE_ENABLED=1 SDKVERSION=16.5 2>&1 | tee /tmp/pm120-probe-on-build.log
          if grep -q 'incompatible arm64e ABI compiler' /tmp/pm120-probe-on-build.log; then echo 'FATAL: incompatible arm64e ABI compiler'; exit 1; fi
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          OTOOL="$(xcrun -f otool 2>/dev/null || echo otool)" scripts/verify-foreground-probe-package.sh "$deb" 1
          xcrun otool -hv .theos/obj/arm64e/ProMotion120.dylib
          # Probe-off clean build
          make clean SDKVERSION=16.5
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide PM_FOREGROUND_PROBE_ENABLED=0 SDKVERSION=16.5 2>&1 | tee /tmp/pm120-probe-off-build.log
          if grep -q 'incompatible arm64e ABI compiler' /tmp/pm120-probe-off-build.log; then echo 'FATAL: incompatible arm64e ABI compiler'; exit 1; fi
          deb_off="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_off"
          OTOOL="$(xcrun -f otool 2>/dev/null || echo otool)" scripts/verify-foreground-probe-package.sh "$deb_off" 0

      - name: Upload deb packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion120-roothide-packages
          path: packages/*
          if-no-files-found: error
