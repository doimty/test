name: Build rootless

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/rootless-build.yml'
      - '**/*.h'
      - '**/*.m'
      - '**/*.xm'
      - '**/*.plist'
      - 'Makefile'
      - 'control'
      - 'layout/**'

jobs:
  package:
    name: Package (rootless)
    runs-on: macos-14

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: rootless
      FINALPACKAGE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install Theos SDK with private frameworks
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build package
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make clean SDKVERSION=16.5
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless SDKVERSION=16.5

      - name: Upload deb packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion120-rootless-packages
          path: packages/*
          if-no-files-found: error
