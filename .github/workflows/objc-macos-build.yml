name: ObjC macOS Build

on:
  workflow_dispatch:
    inputs:
      cpms_probe:
        description: 'Enable CPMS pass-through probe (INSULATION_CPMS_PROBE_ENABLED=1)'
        type: boolean
        required: false
        default: false
      decision_probe:
        description: 'Enable decision pass-through probe (INSULATION_PROBE_ENABLED=1)'
        type: boolean
        required: false
        default: false
      package_buildname:
        description: 'Package build name suffix (e.g., decisionprobe1)'
        type: string
        required: false
        default: ''
  push:
    branches:
      - objc-macos-build

jobs:
  package:
    name: Package ObjC ${{ matrix.scheme }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme:
          - rootless
          - roothide
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
      FINALPACKAGE: 1
      INSULATION_CPMS_PROBE_ENABLED: ${{ inputs.cpms_probe == true && '1' || '0' }}
      INSULATION_PROBE_ENABLED: ${{ inputs.decision_probe == true && '1' || '0' }}
      PACKAGE_BUILDNAME: ${{ inputs.package_buildname || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install packaging tools
        run: |
          brew update
          brew install dpkg ldid make libplist

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Install Theos SDK with private frameworks
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build ObjC ${{ matrix.scheme }} package
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          bash -n scripts/check-objc-port.sh scripts/build-objc-package.sh scripts/setup-linux-theos-env.sh scripts/test-insulationctl-args.sh scripts/verify-insulationctl-package.sh
          scripts/check-objc-port.sh
          scripts/test-insulationctl-args.sh
          scripts/build-objc-package.sh "${THEOS_PACKAGE_SCHEME}"

      - name: Inspect package slices
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          rm -rf /tmp/insulation-pkg
          mkdir -p /tmp/insulation-pkg
          ls -l packages
          deb="$(ls packages/*.deb | head -n 1)"
          dpkg-deb -x "$deb" /tmp/insulation-pkg
          prefs_bin="$(find /tmp/insulation-pkg -path '*/Library/PreferenceBundles/InsulationPrefs.bundle/InsulationPrefs' -type f | head -n 1)"
          test -n "$prefs_bin"
          xcrun otool -hv "$prefs_bin"
          xcrun otool -L "$prefs_bin"
          scripts/verify-insulationctl-package.sh "$deb"

      - name: Upload deb packages
        uses: actions/upload-artifact@v4
        with:
          name: insulation-objc-${{ matrix.scheme }}-packages
          path: packages/*
          if-no-files-found: error
